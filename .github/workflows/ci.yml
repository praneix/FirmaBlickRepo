name: FirmaBlick website CI
on:
  pull_request:
    paths:
      - 'site/**'
      - 'tests/**'
      - 'ingestion/**'
      - 'data-contracts/**'
      - 'docs/genesis-ingestion.md'
      - 'docs/snapshot-store.md'
      - 'docs/normalization-quality.md'
      - 'docs/eurostat-reconciliation.md'
      - 'scripts/**'
      - 'package*.json'
      - 'vercel.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Python GENESIS client regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Credential-free provider gate
        run: |
          set +e
          env -u GENESIS_TOKEN python3 -m ingestion.genesis logincheck >/tmp/genesis-out.log 2>/tmp/genesis-err.log
          status=$?
          set -e
          test "$status" -eq 2
          grep -q 'GENESIS_TOKEN is required' /tmp/genesis-err.log
      - name: Confirm generated files
        run: |
          test -f dist/index.html
          test -f dist/site.mjs
          test -f dist/styles.css
