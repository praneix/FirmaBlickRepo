name: CV1-17 Original Source Restoration Check
on:
  push:
    branches: ['agent/cv1-17-statistical-source-retention-20261120']
    paths:
      - 'scripts/verify-restored-statistical-archives.py'
      - '.github/workflows/cv1-17-source-restoration.yml'
      - 'docs/evidence/cv1-17-private-source-archive-restoration-2026-11-20.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download authenticated Destatis original (temporary Actions evidence)
        uses: actions/download-artifact@v4
        with:
          repository: praneix/FirmaBlickRepo
          run-id: 44702970458
          name: genesis-extended-original-unpublished-44702970458
          github-token: ${{ github.token }}
          path: /tmp/cv1-17/destatis
      - name: Download matching independent Eurostat original
        uses: actions/download-artifact@v4
        with:
          repository: praneix/FirmaBlickRepo
          run-id: 44703565920
          name: eurostat-live-unpublished-44703565920
          github-token: ${{ github.token }}
          path: /tmp/cv1-17/eurostat
      - name: Package artifacts into archives and verify all 705 pairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          for source,archive in [('destatis','/tmp/cv1-17/restored-destatis.zip'),('eurostat','/tmp/cv1-17/restored-eurostat.zip')]:
              root=Path('/tmp/cv1-17')/source
              with ZipFile(archive,'w',ZIP_DEFLATED) as z:
                  for file in sorted(root.rglob('*')):
                      if file.is_file(): z.write(file,file.relative_to(root))
          PY
          # Repacked zip bytes differ from the original archived artifact, so use
          # the verifier against the *original* CI artifact when available through
          # the connector; this workflow separately validates all extracted objects.
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import importlib.util
          spec=importlib.util.spec_from_file_location('v','scripts/verify-restored-statistical-archives.py')
          v=importlib.util.module_from_spec(spec);spec.loader.exec_module(v)
          d=Path('/tmp/cv1-17/destatis/genesis/firmablick/v1')
          e=Path('/tmp/cv1-17/eurostat/eurostat/firmablick/v1/eurostat')
          observations=v.destatis(d)
          digest=v.eurostat(e,observations)
          assert len(observations)==705
          print('CI_RESTORATION_VERIFIED_705_PARITY',digest)
          PY
      - name: Reject modified original archive (fail-closed regression)
        shell: bash
        run: |
          python3 - <<'PY'
          import sys,importlib.util
          from pathlib import Path
          p='scripts/verify-restored-statistical-archives.py'
          spec=importlib.util.spec_from_file_location('v',p)
          v=importlib.util.module_from_spec(spec);spec.loader.exec_module(v)
          broken=Path('/tmp/cv1-17/tampered.zip')
          broken.write_bytes(b'clearly corrupted zip archive')
          try:v.unpack(broken,v.CHECKSUMS['destatis'],Path('/tmp/cv1-17/not-extracted'))
          except ValueError:print('TAMPERED_SOURCE_REJECTED')
          else:raise RuntimeError('Corruption gate failed')
          PY
      - name: Summarize scope
        run: |
          echo 'Restore and cross-source parity validated; source archives remain unpublished.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This does not certify immutable Google Drive retention or public data approval.' >> "$GITHUB_STEP_SUMMARY"
