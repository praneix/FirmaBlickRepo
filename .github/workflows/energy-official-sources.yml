name: Energy research official source acquisition (no deployment)
on:
  push:
    branches: ['agent/energy-flagship-evidence-20261120']
    paths:
      - 'research/energy/source_acquisition.py'
      - '.github/workflows/energy-official-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire source snapshots without secrets
        run: python3 research/energy/source_acquisition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmablick-energy-official-snapshots-${{github.run_id}}
          path: artifacts/energy-research/
          retention-days: 30
          if-no-files-found: error

      - name: Report acquisition run for research verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "Energy source acquisition: ${JOB_STATUS}; https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Check raw artifact source coverage; no publication." > /tmp/energy-run-note
          gh issue comment 35 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/energy-run-note
