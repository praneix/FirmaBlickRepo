name: FirmaBlick website CI
on:
  pull_request:
    paths:
      - 'site/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'vercel.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Confirm generated files
        run: |
          test -f dist/index.html
          test -f dist/site.mjs
          test -f dist/styles.css
